<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>DynastyVault Admin</title>
<script src="config.js"></script>
<style>
:root{--bg:#07080B;--s1:#0E0F14;--s2:#14161D;--line:rgba(212,175,55,.2);--line2:rgba(212,175,55,.45);--gold:#D4AF37;--gold-soft:#E9CF7A;--gold-pale:#FFF1A8;--bar:#A88426;--bar-hi:#D4AF37;--ink:#EFE8D6;--muted:#9C9583;--warn:#F2A65A;--ok:#7BC47F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{font:700 18px/1.1 Georgia,"Times New Roman",serif;letter-spacing:.14em;color:var(--gold)}
.brand small{display:block;font:500 12px system-ui,sans-serif;letter-spacing:0;color:var(--muted);margin-top:4px}
button,input,select{font:inherit}
.btn{border:1px solid var(--line2);background:rgba(212,175,55,.08);color:var(--gold-soft);padding:.5rem .9rem;border-radius:999px;font-weight:700;cursor:pointer}
.btn.gold{background:linear-gradient(135deg,#AA7C11,#D4AF37 40%,#FFF1A8 55%,#D4AF37 70%);color:#1A1405;border:0}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold-pale);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--muted);padding:.35rem .8rem;border-radius:999px;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:rgba(212,175,55,.16);color:var(--gold-pale)}
input,select{background:var(--s1);color:var(--ink);border:1px solid var(--line2);border-radius:12px;padding:.6rem .8rem;min-width:0}
.login{max-width:420px;margin:12vh auto 0;padding:24px;border:1px solid var(--line);border-radius:20px;background:var(--s1)}
.login h1{font:700 22px Georgia,serif;color:var(--gold);margin:0 0 6px}
.login label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
.login input{width:100%}
.msg{margin-top:12px;font-size:13px;color:var(--warn)}
.banner{margin:16px 0 0;padding:12px 14px;border-radius:14px;border:1px solid rgba(242,166,90,.5);background:rgba(242,166,90,.08);font-size:14px}
.banner b{color:var(--warn)}
.bar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:20px 0 4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.tile{padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--s1)}
.tile b{display:block;font:700 28px/1.1 Georgia,serif;color:var(--ink);font-variant-numeric:tabular-nums}
.tile span{font-size:12.5px;color:var(--muted)}
.tile.live b{color:var(--gold-pale)}
.tile.live b::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:8px;vertical-align:middle;box-shadow:0 0 0 4px rgba(123,196,127,.18)}
.card{margin-top:14px;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--s1);min-width:0}
.card h2{margin:0 0 2px;font:700 16px Georgia,serif;color:var(--gold-soft)}
.card p.sub{margin:0 0 10px;font-size:12.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.chart{position:relative;height:220px}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
.chart .ax{fill:var(--muted);font-size:11px}
.chart .grid{stroke:rgba(239,232,214,.08)}
.chart rect.b{fill:var(--bar)}
.chart rect.b.on{fill:var(--bar-hi)}
.tip{position:absolute;pointer-events:none;padding:8px 10px;border-radius:10px;background:#1b1d25;border:1px solid var(--line2);font-size:12.5px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .12s}
.tip strong{display:block;font-size:15px;color:var(--ink)}
.tip span{color:var(--muted)}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.rank li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:13.5px}
.rank .tr{grid-column:1/-1;height:6px;border-radius:3px;background:rgba(239,232,214,.06);overflow:hidden}
.rank .tr i{display:block;height:100%;border-radius:3px;background:var(--bar)}
.rank b{font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;border-bottom:1px solid rgba(239,232,214,.07);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600}
.tablewrap{overflow-x:auto;margin-top:10px}
.prof{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(239,232,214,.07);flex-wrap:wrap}
.prof .n{flex:1;min-width:150px}.prof .n small{display:block;color:var(--muted);font-size:12px}
.pill{font-size:11px;font-weight:700;padding:.15rem .55rem;border-radius:999px;border:1px solid var(--line)}
.keys{display:flex;flex-wrap:wrap;gap:8px}
.key{font-size:13px;padding:.35rem .7rem;border-radius:999px;border:1px solid var(--line)}
.key.on{border-color:rgba(123,196,127,.5)}.key.on::before{content:"✓ ";color:var(--ok)}
.key.off::before{content:"○ ";color:var(--warn)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.foot{margin-top:24px;font-size:12px;color:var(--muted)}
@media (max-width:520px){.tile b{font-size:24px}.chart{height:190px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var store = { get: function (k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } } };
  var SRV = (store.get('dva.srv') || String((window.DV_CONFIG || {}).server || '')).trim().replace(/\/+$/, '');
  var KEY = store.get('dva.key'); var DAYS = 30; var data = null; var timer = 0; var tableOn = false;
  function el(tag, attrs, kids) { var e = document.createElement(tag); if (attrs) Object.keys(attrs).forEach(function (k) { if (k === 'text') e.textContent = attrs[k]; else if (k === 'cls') e.className = attrs[k]; else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), attrs[k]); else e.setAttribute(k, attrs[k]); }); (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); }); return e; }
  var fmt = function (n) { return (+n || 0).toLocaleString('en-IN'); };
  var sum = function (arr, k) { return arr.reduce(function (s, d) { return s + (d[k] || 0); }, 0); };
  var dshort = function (d) { var p = d.split('-'); return +p[2] + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+p[1] - 1]; };

  function login(msg) {
    clearInterval(timer); app.innerHTML = '';
    var srv = el('input', { id: 'srv', type: 'url', placeholder: 'https://dynastyvault-server.onrender.com', value: SRV });
    var key = el('input', { id: 'key', type: 'password', placeholder: 'ADMIN_KEY from Render', value: KEY, autocomplete: 'current-password' });
    var go = el('button', { cls: 'btn gold', text: 'Open dashboard', style: 'margin-top:16px;width:100%', onclick: function () { SRV = srv.value.trim().replace(/\/+$/, ''); KEY = key.value.trim(); store.set('dva.srv', SRV); store.set('dva.key', KEY); load(); } });
    key.addEventListener('keydown', function (e) { if (e.key === 'Enter') go.click(); });
    app.appendChild(el('div', { cls: 'login' }, [
      el('h1', { text: 'DynastyVault Admin' }),
      el('p', { cls: 'muted', text: 'Your visitors, family profiles and sales in one place.' }),
      el('label', { for: 'srv', text: 'Server link (Render)' }), srv,
      el('label', { for: 'key', text: 'Admin key (the ADMIN_KEY you set in Render)' }), key, go,
      msg ? el('p', { cls: 'msg', text: msg }) : null
    ]));
  }

  function load() {
    if (!SRV || !KEY) return login('Fill in both boxes.');
    fetch(SRV + '/api/admin/stats?key=' + encodeURIComponent(KEY) + '&days=' + DAYS).then(function (r) { return r.json().then(function (j) { return { r: r, j: j }; }); })
      .then(function (x) { if (x.r.status === 401) return login('Wrong admin key.'); if (!x.j.ok) return login(x.j.error || 'The server did not answer properly.'); data = x.j; draw(); clearInterval(timer); timer = setInterval(refresh, 60000); })
      .catch(function () { login('Could not reach the server. The free Render server can take up to a minute to wake up — wait and try again.'); });
  }
  function refresh() { fetch(SRV + '/api/admin/stats?key=' + encodeURIComponent(KEY) + '&days=' + DAYS).then(function (r) { return r.json(); }).then(function (j) { if (j.ok) { data = j; draw(); } }).catch(function () {}); }

  function post(path, body) { return fetch(SRV + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(function (r) { return r.json(); }); }

  function tile(n, label, cls) { return el('div', { cls: 'tile' + (cls ? ' ' + cls : '') }, [el('b', { text: fmt(n) }), el('span', { text: label })]); }
  function rank(obj, empty) {
    var rows = Object.keys(obj || {}).map(function (k) { return [k, obj[k]]; }).sort(function (a, b) { return b[1] - a[1]; }).slice(0, 8);
    if (!rows.length) return el('p', { cls: 'empty', text: empty });
    var max = rows[0][1] || 1;
    return el('ul', { cls: 'rank' }, rows.map(function (r) { var tr = el('span', { cls: 'tr' }, [el('i', { style: 'width:' + Math.max(2, r[1] / max * 100) + '%' })]); return el('li', null, [el('span', { text: r[0] }), el('b', { text: fmt(r[1]) }), tr]); }));
  }

  function chart(days) {
    var box = el('div', { cls: 'chart', role: 'img', 'aria-label': 'Unique phones per day for the last ' + days.length + ' days' });
    var W = 1000, H = 220, L = 34, B = 24, T = 8;
    var max = Math.max(4, Math.max.apply(null, days.map(function (d) { return d.users; })));
    var step = Math.pow(10, Math.floor(Math.log10(max))); var top = Math.ceil(max / step) * step; if (top / step > 6) step *= 2; top = Math.ceil(max / step) * step;
    var NS = 'http://www.w3.org/2000/svg'; var svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); svg.setAttribute('preserveAspectRatio', 'none');
    var y = function (v) { return T + (H - T - B) * (1 - v / top); };
    for (var g = 0; g <= top; g += step) { var ln = document.createElementNS(NS, 'line'); ln.setAttribute('x1', L); ln.setAttribute('x2', W); ln.setAttribute('y1', y(g)); ln.setAttribute('y2', y(g)); ln.setAttribute('class', 'grid'); ln.setAttribute('vector-effect', 'non-scaling-stroke'); svg.appendChild(ln); }
    var bw = (W - L) / days.length; var gap = Math.min(6, bw * .25);
    var tip = el('div', { cls: 'tip' }); var bars = [];
    days.forEach(function (d, i) {
      var h = Math.max(d.users ? 3 : 0, (H - T - B) * d.users / top);
      var r = document.createElementNS(NS, 'rect'); r.setAttribute('x', L + i * bw + gap / 2); r.setAttribute('width', Math.max(1, bw - gap)); r.setAttribute('y', H - B - h); r.setAttribute('height', h); r.setAttribute('rx', Math.min(4, (bw - gap) / 2)); r.setAttribute('class', 'b'); svg.appendChild(r); bars.push(r);
      var hit = document.createElementNS(NS, 'rect'); hit.setAttribute('x', L + i * bw); hit.setAttribute('width', bw); hit.setAttribute('y', 0); hit.setAttribute('height', H); hit.setAttribute('fill', 'transparent'); hit.setAttribute('tabindex', '0');
      hit.setAttribute('aria-label', dshort(d.d) + ': ' + d.users + ' phones, ' + d.visit + ' visits');
      var show = function () { bars.forEach(function (b) { b.classList.remove('on'); }); r.classList.add('on'); tip.innerHTML = ''; tip.appendChild(el('strong', { text: fmt(d.users) + ' phones' })); tip.appendChild(el('span', { text: dshort(d.d) + ' · ' + fmt(d.visit) + ' visits · ' + fmt(d.tree) + ' trees' })); var bx = box.getBoundingClientRect(); var px = (L + (i + .5) * bw) / W * bx.width; var tw = tip.offsetWidth / 2 + 4; tip.style.left = Math.max(tw, Math.min(bx.width - tw, px)) + 'px'; tip.style.top = (y(d.users) / H * bx.height) + 'px'; tip.style.opacity = 1; };
      var hide = function () { r.classList.remove('on'); tip.style.opacity = 0; };
      hit.addEventListener('pointerenter', show); hit.addEventListener('pointerdown', show); hit.addEventListener('focus', show); hit.addEventListener('pointerleave', hide); hit.addEventListener('blur', hide);
      svg.appendChild(hit);
    });
    box.appendChild(svg);
    // y labels + a few x labels in HTML so text is never squashed by the stretched SVG
    for (var v = 0; v <= top; v += step) box.appendChild(el('span', { cls: 'ax', text: fmt(v), style: 'position:absolute;left:0;top:' + (y(v) / H * 100) + '%;transform:translateY(-50%);font-size:11px;color:var(--muted)' }));
    var every = Math.ceil(days.length / 6);
    days.forEach(function (d, i) { if (i % every && i !== days.length - 1) return; box.appendChild(el('span', { text: dshort(d.d), style: 'position:absolute;bottom:0;left:' + ((L + (i + .5) * bw) / W * 100) + '%;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap' })); });
    box.appendChild(tip);
    return box;
  }
  function table(days) {
    var head = ['Day', 'Phones', 'Visits', 'App opens', 'Trees', 'Profiles', 'Films', 'Royal'];
    var t = el('table', null, [el('thead', null, [el('tr', null, head.map(function (h) { return el('th', { text: h }); }))]),
      el('tbody', null, days.slice().reverse().map(function (d) { return el('tr', null, [dshort(d.d), d.users, d.visit, d.app, d.tree, d.pub, d.film, d.royal].map(function (c, i) { return el('td', { text: i ? fmt(c) : c }); })); }))]);
    return el('div', { cls: 'tablewrap' }, [t]);
  }

  function draw() {
    var d = data, days = d.days || [], today = days[days.length - 1] || {};
    app.innerHTML = '';
    var seg = el('div', { cls: 'seg', role: 'group', 'aria-label': 'Date range' }, [7, 30, 90].map(function (n) { return el('button', { text: n + ' days', 'aria-pressed': String(DAYS === n), onclick: function () { DAYS = n; load(); } }); }));
    app.appendChild(el('header', null, [el('div', { cls: 'brand' }, ['DYNASTYVAULT', el('small', { text: 'Admin dashboard · updates every minute' })]),
      el('div', { cls: 'row' }, [el('button', { cls: 'btn', text: '↻ Refresh', onclick: refresh }), el('button', { cls: 'btn', text: 'Log out', onclick: function () { KEY = ''; store.set('dva.key', ''); login(); } })])]));
    if (d.storage !== 'supabase') app.appendChild(el('div', { cls: 'banner' }, [el('b', { text: 'Numbers are temporary. ' }), 'The server is saving visitors and family profiles in a file that Render wipes on every restart. Add SUPABASE_URL and SUPABASE_SERVICE_KEY in Render (SERVER-SETUP.txt) to keep them forever.']));
    app.appendChild(el('div', { cls: 'bar-row' }, [el('div', { cls: 'muted', text: 'Showing the last ' + DAYS + ' days (India time)' }), seg]));
    var tiles = el('div', { cls: 'tiles' }, [
      tile(d.online, 'online now (last 5 min)', 'live'),
      tile(today.users, 'phones today'),
      tile(d.uniqueUsers, 'phones in ' + DAYS + ' days'),
      tile(sum(days, 'tree'), 'family trees made'),
      tile(d.profiles.total, 'family profiles (' + d.profiles.public + ' public, ' + d.profiles.private + ' private)'),
      tile(sum(days, 'royal'), 'Royal orders approved')
    ]);
    app.appendChild(tiles);
    var tbtn = el('button', { cls: 'btn', text: tableOn ? 'Hide table' : 'Show table', 'aria-expanded': String(tableOn), onclick: function () { tableOn = !tableOn; draw(); } });
    app.appendChild(el('section', { cls: 'card' }, [el('div', { cls: 'row', style: 'justify-content:space-between' }, [el('div', null, [el('h2', { text: 'People using DynastyVault' }), el('p', { cls: 'sub', text: 'Different phones that opened the website each day. Tap a bar for the day’s numbers.' })]), tbtn]), chart(days), tableOn ? table(days) : null]));
    var tot = d.totals.ev || {};
    var funnel = { 'Website visits': tot.visit || 0, 'Family trees made': tot.tree || 0, 'Profiles put online': tot.pub || 0, 'Links shared': tot.share || 0, 'Documentaries made': tot.film || 0, 'Royal orders': tot.royal || 0 };
    app.appendChild(el('div', { cls: 'grid2' }, [
      el('section', { cls: 'card' }, [el('h2', { text: 'From visit to sale' }), el('p', { cls: 'sub', text: 'Totals for the range.' }), rank(funnel, 'Nothing yet.')]),
      el('section', { cls: 'card' }, [el('h2', { text: 'Where visitors come from' }), el('p', { cls: 'sub', text: 'From links with ?ref= or ?utm_source=, and other websites.' }), rank(d.totals.rf, 'No sources yet — share links like …/?ref=instagram to see them here.')]),
      el('section', { cls: 'card' }, [el('h2', { text: 'Pages opened' }), rank(d.totals.pg, 'No visits yet.')]),
      el('section', { cls: 'card' }, [el('h2', { text: 'Phone languages' }), rank(d.totals.lg, 'No visits yet.')])
    ]));
    var profs = el('section', { cls: 'card' }, [el('h2', { text: 'Newest family profiles' }), el('p', { cls: 'sub', text: 'Hide a profile if it is fake or abusive — it disappears from Explore and its link stops working.' })]);
    if (!d.profiles.recent.length) profs.appendChild(el('p', { cls: 'empty', text: 'No family has put its profile online yet.' }));
    d.profiles.recent.forEach(function (p) {
      var b = el('button', { cls: 'btn', text: p.hidden ? 'Unhide' : 'Hide', onclick: function () { b.disabled = true; post('/api/admin/dyn/hide', { key: KEY, h: p.h, hide: !p.hidden }).then(refresh, refresh); } });
      profs.appendChild(el('div', { cls: 'prof' }, [el('div', { cls: 'n' }, [el('b', { text: p.n }), el('small', { text: '@' + p.h + ' · ' + fmt(p.m) + ' members · ' + fmt(p.fol) + ' followers' })]), el('span', { cls: 'pill', text: p.hidden ? 'hidden' : p.vis === 'public' ? '🌍 public' : '🔒 private' }), b]));
    });
    app.appendChild(profs);
    if (d.reports && d.reports.length) app.appendChild(el('section', { cls: 'card' }, [el('h2', { text: 'Reports from visitors' })].concat(d.reports.slice(0, 20).map(function (r) { return el('div', { cls: 'prof' }, [el('div', { cls: 'n' }, [el('b', { text: '@' + r.h }), el('small', { text: (r.why || '—') + ' · ' + new Date(r.t).toLocaleString('en-IN') })])]); }))));
    var oid = el('input', { placeholder: 'Order ID e.g. DV-1234', 'aria-label': 'Order ID' }), n = el('input', { type: 'number', value: '1', min: '1', max: '20', style: 'width:80px', 'aria-label': 'How many films' }), out = el('span', { cls: 'muted' });
    app.appendChild(el('section', { cls: 'card' }, [el('h2', { text: 'Give extra documentaries' }), el('p', { cls: 'sub', text: 'After a customer pays for more films, add them to their Royal order here.' }),
      el('div', { cls: 'row' }, [oid, n, el('button', { cls: 'btn gold', text: 'Add films', onclick: function () { out.textContent = '…'; post('/api/admin/films', { key: KEY, orderId: oid.value, add: +n.value || 1 }).then(function (j) { out.textContent = j.ok ? '✓ ' + j.orderId + ' now has ' + j.left + ' films left' : (j.error || 'Failed'); }, function () { out.textContent = 'Could not reach the server.'; }); } }), out])]));
    var k = d.keys || {};
    app.appendChild(el('section', { cls: 'card' }, [el('h2', { text: 'Server switches' }), el('div', { cls: 'keys' }, [
      el('span', { cls: 'key ' + (k.gemini ? 'on' : 'off'), text: 'GEMINI_KEY — AI stories' }), el('span', { cls: 'key ' + (k.billing ? 'on' : 'off'), text: 'GEMINI_BILLING — portraits & films' }),
      el('span', { cls: 'key ' + (k.voice ? 'on' : 'off'), text: 'DEEPINFRA_KEY — cloned voice' }), el('span', { cls: 'key ' + (k.unlock ? 'on' : 'off'), text: 'UNLOCK_SECRET — unlock codes' }),
      el('span', { cls: 'key ' + (d.storage === 'supabase' ? 'on' : 'off'), text: 'SUPABASE — keeps profiles & numbers' })])]));
    app.appendChild(el('p', { cls: 'foot', text: 'Visitor numbers are anonymous: a random ID per phone, hashed on the server. No names or IP addresses are kept.' }));
  }
  if (SRV && KEY) load(); else login();
})();
</script>
</body>
</html>
